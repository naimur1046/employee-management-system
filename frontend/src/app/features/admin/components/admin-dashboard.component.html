<div class="admin-container">
  <!-- Sidebar Navigation -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <h2>Admin Panel</h2>
    </div>
    <nav class="sidebar-menu">
      <ul>
        <li
          *ngFor="let section of sections"
          [class.active]="activeSection === section.id"
          (click)="selectSection(section.id)">
          <a>{{ section.name }}</a>
        </li>
      </ul>
    </nav>
  </aside>

  <main class="content">
    <div class="content-body">
      <app-dashboard *ngIf="activeSection === 'dashboard'"></app-dashboard>
      <app-manage-employee
        *ngIf="activeSection === 'employees'"
        (addNew)="showAddEmployee()">
      </app-manage-employee>
      <app-add-employee
        *ngIf="activeSection === 'addEmployee'"
        (cancel)="showManageEmployees()"
        (employeeAdded)="showManageEmployees()">
      </app-add-employee>
      <div *ngIf="activeSection === 'settings'" class="settings-section">
        <p>Settings content will go here</p>
      </div>
    </div>
  </main>
</div>
