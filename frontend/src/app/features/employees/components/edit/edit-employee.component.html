<div class="edit-employee-container">
  <ng-container *ngIf="isLoading; else contentOrError">
    <div class="loading-container">
      <div class="loading-spinner"></div>
      <p>Loading employee details...</p>
    </div>
  </ng-container>

  <ng-template #contentOrError>
    <div *ngIf="errorMessage" class="error-container">
      <span class="material-icons error-icon">error_outline</span>
      <p class="error-message">{{ errorMessage }}</p>
      <button class="btn-retry" (click)="goBack()">
        <span class="material-icons">arrow_back</span> Back to List
      </button>
    </div>

    <div *ngIf="!errorMessage" class="edit-form-wrapper">
      <!-- Success Message -->
      <div *ngIf="showSuccess" class="success-message">
        <span class="material-icons">check_circle</span>
        Employee updated successfully!
      </div>

      <div class="form-header">
        <h1 class="form-title">Edit Employee</h1>
        <button class="btn-back" (click)="goBack()">
          <span class="material-icons">arrow_back</span> Back to List
        </button>
      </div>

      <form (ngSubmit)="onSubmit()" class="employee-form">
        <div class="form-section">
          <h2 class="section-title">Personal Information</h2>
          <div class="form-grid">
            <div class="form-group">
              <label for="fullName">Full Name *</label>
              <input
                type="text"
                id="fullName"
                name="fullName"
                [(ngModel)]="employee.fullName"
                (ngModelChange)="onInputChange()"
                class="form-control"
                placeholder="Enter full name"
              />
            </div>

            <div class="form-group">
              <label for="name">Name *</label>
              <input
                type="text"
                id="name"
                name="name"
                [(ngModel)]="employee.name"
                (ngModelChange)="onInputChange()"
                class="form-control"
                placeholder="Enter name"
              />
            </div>

            <div class="form-group">
              <label for="contactNumber">Contact Number *</label>
              <input
                type="text"
                id="contactNumber"
                name="contactNumber"
                [(ngModel)]="employee.contactNumber"
                (ngModelChange)="onInputChange()"
                class="form-control"
                placeholder="Enter contact number"
              />
            </div>

            <div class="form-group">
              <label for="bloodGroup">Blood Group</label>
              <select
                id="bloodGroup"
                name="bloodGroup"
                [(ngModel)]="employee.bloodGroup"
                class="form-control"
              >
                <option *ngFor="let option of bloodGroups" [value]="option.value">
                  {{ option.label }}
                </option>
              </select>
            </div>
          </div>
        </div>

        <div class="form-section">
          <h2 class="section-title">Professional Information</h2>
          <div class="form-grid">
            <div class="form-group">
              <label for="designation">Designation *</label>
              <select
                id="designation"
                name="designation"
                [(ngModel)]="employee.designation"
                class="form-control"
              >
                <option *ngFor="let option of designations" [value]="option.value">
                  {{ option.label }}
                </option>
              </select>
            </div>

            <div class="form-group">
              <label for="department">Department *</label>
              <select
                id="department"
                name="department"
                [(ngModel)]="employee.department"
                class="form-control"
              >
                <option *ngFor="let option of departments" [value]="option.value">
                  {{ option.label }}
                </option>
              </select>
            </div>

            <div class="form-group">
              <label for="officeEmail">Office Email *</label>
              <input
                type="email"
                id="officeEmail"
                name="officeEmail"
                [(ngModel)]="employee.officeEmail"
                (ngModelChange)="onInputChange()"
                class="form-control"
                placeholder="Enter office email"
              />
            </div>

            <div class="form-group">
              <label for="pin">PIN</label>
              <input
                type="text"
                id="pin"
                name="pin"
                [(ngModel)]="employee.pin"
                (ngModelChange)="onInputChange()"
                class="form-control"
                placeholder="Enter PIN"
              />
            </div>
          </div>
        </div>

        <div class="form-section">
          <h2 class="section-title">Organization Details</h2>
          <div class="form-grid">
            <div class="form-group">
              <label for="organization">Organization *</label>
              <select
                id="organization"
                name="organization"
                [(ngModel)]="employee.organization"
                class="form-control"
              >
                <option *ngFor="let option of organizations" [value]="option.value">
                  {{ option.label }}
                </option>
              </select>
            </div>

            <div class="form-group">
              <label for="branch">Branch *</label>
              <select
                id="branch"
                name="branch"
                [(ngModel)]="employee.branch"
                class="form-control"
              >
                <option *ngFor="let option of branches" [value]="option.value">
                  {{ option.label }}
                </option>
              </select>
            </div>

            <div class="form-group">
              <label for="campus">Campus *</label>
              <select
                id="campus"
                name="campus"
                [(ngModel)]="employee.campus"
                class="form-control"
              >
                <option *ngFor="let option of campuses" [value]="option.value">
                  {{ option.label }}
                </option>
              </select>
            </div>
          </div>
        </div>

        <div *ngIf="errorMessage" class="form-error">
          <span class="material-icons">error</span>
          {{ errorMessage }}
        </div>

        <div class="form-actions">
          <button
            type="button"
            class="btn-cancel"
            (click)="onCancel()"
            [disabled]="isSubmitting"
          >
            <span class="material-icons">close</span> Cancel
          </button>
          <button
            type="submit"
            class="btn-submit"
            [disabled]="isSubmitting"
          >
            <span class="material-icons">save</span>
            {{ isSubmitting ? 'Updating...' : 'Update Employee' }}
          </button>
        </div>
      </form>
    </div>
  </ng-template>
</div>
