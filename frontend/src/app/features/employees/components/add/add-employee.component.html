<div class="add-employee-container">
  <div class="form-header">
    <h1 class="page-title">Add New Employee</h1>
    <button class="btn-back" (click)="onCancel()">
      <span class="icon-placeholder">←</span> Back
    </button>
  </div>

  <div class="alert alert-success" *ngIf="showSuccess">
    <span class="icon-placeholder">✓</span> Employee added successfully!
  </div>

  <div class="alert alert-error" *ngIf="errorMessage">
    <span class="icon-placeholder">⚠</span> {{ errorMessage }}
  </div>

  <form (ngSubmit)="onSubmit()" class="employee-form">
    <div class="form-section">
      <h2 class="section-title"><span class="icon-placeholder">👤</span> Personal Information</h2>

      <div class="form-row">
        <div class="form-group">
          <label for="fullName" class="form-label">
            Full Name <span class="required">*</span>
          </label>
          <input
            type="text"
            id="fullName"
            class="form-input"
            placeholder="Enter full name"
            [(ngModel)]="employee.fullName"
            name="fullName"
            (ngModelChange)="onInputChange()"
            required
          />
        </div>

        <div class="form-group">
          <label for="name" class="form-label"> Short Name </label>
          <input
            type="text"
            id="name"
            class="form-input"
            placeholder="Enter short name"
            [(ngModel)]="employee.name"
            name="name"
          />
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="contactNumber" class="form-label">
            Contact Number <span class="required">*</span>
          </label>
          <input
            type="tel"
            id="contactNumber"
            class="form-input"
            placeholder="+8801..."
            [(ngModel)]="employee.contactNumber"
            name="contactNumber"
            (ngModelChange)="onInputChange()"
            required
          />
        </div>

        <div class="form-group">
          <label for="bloodGroup" class="form-label"> Blood Group </label>
          <select
            id="bloodGroup"
            class="form-select"
            [(ngModel)]="employee.bloodGroup"
            name="bloodGroup"
          >
            <option *ngFor="let bg of bloodGroups" [value]="bg.value">
              {{ bg.label }}
            </option>
          </select>
        </div>
      </div>
    </div>

    <div class="form-section">
      <h2 class="section-title"><span class="icon-placeholder">💼</span> Employment Information</h2>

      <div class="form-row">
        <div class="form-group">
          <label for="department" class="form-label">
            Department <span class="required">*</span>
          </label>
          <select
            id="department"
            class="form-select"
            [(ngModel)]="employee.department"
            name="department"
            (ngModelChange)="onInputChange()"
            required
          >
            <option *ngFor="let dept of departments" [value]="dept.value">
              {{ dept.label }}
            </option>
          </select>
        </div>

        <div class="form-group">
          <label for="designation" class="form-label">
            Designation <span class="required">*</span>
          </label>
          <select
            id="designation"
            class="form-select"
            [(ngModel)]="employee.designation"
            name="designation"
            (ngModelChange)="onInputChange()"
            required
          >
            <option *ngFor="let desig of designations" [value]="desig.value">
              {{ desig.label }}
            </option>
          </select>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="organization" class="form-label"> Organization </label>
          <select
            id="organization"
            class="form-select"
            [(ngModel)]="employee.organization"
            name="organization"
          >
            <option *ngFor="let org of organizations" [value]="org.value">
              {{ org.label }}
            </option>
          </select>
        </div>

        <div class="form-group">
          <label for="branch" class="form-label"> Branch </label>
          <select id="branch" class="form-select" [(ngModel)]="employee.branch" name="branch">
            <option *ngFor="let br of branches" [value]="br.value">
              {{ br.label }}
            </option>
          </select>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="campus" class="form-label"> Campus </label>
          <select id="campus" class="form-select" [(ngModel)]="employee.campus" name="campus">
            <option *ngFor="let camp of campuses" [value]="camp.value">
              {{ camp.label }}
            </option>
          </select>
        </div>

        <div class="form-group">
          <label for="pin" class="form-label"> PIN Code </label>
          <input
            type="text"
            id="pin"
            class="form-input"
            placeholder="Enter PIN"
            [(ngModel)]="employee.pin"
            name="pin"
            maxlength="10"
          />
        </div>
      </div>
    </div>

    <div class="form-section">
      <h2 class="section-title"><span class="icon-placeholder">📧</span> Contact Information</h2>

      <div class="form-row">
        <div class="form-group">
          <label for="officeEmail" class="form-label">
            Office Email <span class="required">*</span>
          </label>
          <input
            type="email"
            id="officeEmail"
            class="form-input"
            placeholder="employee@university.edu"
            [(ngModel)]="employee.officeEmail"
            name="officeEmail"
            (ngModelChange)="onInputChange()"
            required
          />
        </div>

        <div class="form-group">
          <label for="contactNumberDisplay" class="form-label"> Contact Number </label>
          <input
            type="text"
            id="contactNumberDisplay"
            class="form-input"
            placeholder="+8801..."
            [value]="employee.contactNumber"
            disabled
          />
          <small class="form-hint">Primary contact number from personal info</small>
        </div>
      </div>
    </div>

    <div class="form-actions">
      <button type="button" class="btn btn-secondary" (click)="onCancel()">
        <span class="icon-placeholder">✕</span> Cancel
      </button>
      <button type="button" class="btn btn-secondary" (click)="resetForm()">
        <span class="icon-placeholder">↻</span> Reset
      </button>
      <button type="submit" class="btn btn-primary" [disabled]="isSubmitting">
        <span class="icon-placeholder" *ngIf="isSubmitting">⏳</span>
        <span class="icon-placeholder" *ngIf="!isSubmitting">✓</span>
        {{ isSubmitting ? 'Adding...' : 'Add Employee' }}
      </button>
    </div>
  </form>
</div>
