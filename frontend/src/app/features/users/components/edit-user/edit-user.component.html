<div class="edit-user-container">
  <ng-container *ngIf="isLoading; else contentOrError">
    <div class="loading-container">
      <div class="loading-spinner"></div>
      <p>Loading user details...</p>
    </div>
  </ng-container>

  <ng-template #contentOrError>
    <div *ngIf="errorMessage" class="error-container">
      <span class="material-icons error-icon">error_outline</span>
      <p class="error-message">{{ errorMessage }}</p>
      <button class="btn-retry" (click)="goBack()">
        <span class="material-icons">arrow_back</span> Back to List
      </button>
    </div>

    <div *ngIf="!errorMessage" class="edit-form-wrapper">
      <div *ngIf="showSuccess" class="success-message">
        <span class="material-icons">check_circle</span>
        User updated successfully!
      </div>

      <div class="form-header">
        <h1 class="form-title">Edit User</h1>
        <button class="btn-back" (click)="goBack()">
          <span class="material-icons">arrow_back</span> Back to List
        </button>
      </div>

      <form (ngSubmit)="onSubmit()" class="user-form">
        <div class="form-section">
          <h2 class="section-title">User Information</h2>
          <div class="form-grid">
            <div class="form-group">
              <label for="name">Name *</label>
              <input
                type="text"
                id="name"
                name="name"
                [(ngModel)]="user.name"
                (ngModelChange)="onInputChange()"
                class="form-control"
                placeholder="Enter name"
              />
            </div>

            <div class="form-group">
              <label for="email">Email *</label>
              <input
                type="email"
                id="email"
                name="email"
                [(ngModel)]="user.email"
                (ngModelChange)="onInputChange()"
                class="form-control"
                placeholder="Enter email address"
              />
            </div>

            <div class="form-group">
              <label for="password">Password</label>
              <input
                type="password"
                id="password"
                name="password"
                [(ngModel)]="user.password"
                (ngModelChange)="onInputChange()"
                class="form-control"
                placeholder="Leave blank to keep current password"
              />
            </div>

            <div class="form-group">
              <label for="mobileNumber">Mobile Number *</label>
              <input
                type="tel"
                id="mobileNumber"
                name="mobileNumber"
                [(ngModel)]="user.mobileNumber"
                (ngModelChange)="onInputChange()"
                class="form-control"
                placeholder="Enter mobile number"
              />
            </div>

            <div class="form-group">
              <label for="role">Role *</label>
              <select
                id="role"
                name="role"
                [(ngModel)]="user.role"
                (ngModelChange)="onInputChange()"
                class="form-control"
              >
                <option *ngFor="let role of roles" [value]="role.value">
                  {{ role.label }}
                </option>
              </select>
            </div>

            <div class="form-group">
              <label for="status">Status</label>
              <select
                id="status"
                name="status"
                [(ngModel)]="user.status"
                class="form-control"
              >
                <option *ngFor="let status of statuses" [value]="status.value">
                  {{ status.label }}
                </option>
              </select>
            </div>
          </div>
        </div>

        <div *ngIf="errorMessage" class="form-error">
          <span class="material-icons">error</span>
          {{ errorMessage }}
        </div>

        <div class="form-actions">
          <button
            type="button"
            class="btn-cancel"
            (click)="onCancel()"
            [disabled]="isSubmitting"
          >
            <span class="material-icons">close</span> Cancel
          </button>
          <button
            type="submit"
            class="btn-submit"
            [disabled]="isSubmitting"
          >
            <span class="material-icons">save</span>
            {{ isSubmitting ? 'Updating...' : 'Update User' }}
          </button>
        </div>
      </form>
    </div>
  </ng-template>
</div>
