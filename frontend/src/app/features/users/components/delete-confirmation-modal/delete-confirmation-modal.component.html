<div *ngIf="isVisible" class="modal-overlay" (click)="onClose()">
  <div class="modal-content" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <span class="material-icons modal-icon delete-icon">warning</span>
      <h3>Confirm Delete</h3>
    </div>
    <div class="modal-body">
      <p>Are you sure you want to delete this user?</p>
      <p class="employee-name">{{ employeeName }}</p>
      <p class="warning-text">This action cannot be undone.</p>
    </div>
    <div class="modal-footer">
      <button class="btn-modal btn-cancel" (click)="onClose()">
        <span class="material-icons">close</span> Cancel
      </button>
      <button class="btn-modal btn-confirm-delete" (click)="onConfirm()">
        <span class="material-icons">delete</span> Delete
      </button>
    </div>
  </div>
</div>
